name: Initialize source
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: initialize-source
  cancel-in-progress: false
jobs:
  initialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify and expand the pinned source archive
        env:
          SOURCE_ZIP: frosted-background-0.3.0-source.zip
          SOURCE_SHA256: a82e07185c44a5c0ff5c2d015a2f643c4626949a1f623a37f31d910c186db26b
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, stat, subprocess, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / os.environ['SOURCE_ZIP']
          assert archive.is_file() and not archive.is_symlink(), 'Archive must be a regular file'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['SOURCE_SHA256'], 'Archive checksum mismatch'
          pending, names = [], set()
          with zipfile.ZipFile(archive) as source:
              assert sum(i.file_size for i in source.infolist()) < 50_000_000, 'Archive is too large'
              for item in source.infolist():
                  parts = item.filename.rstrip('/').split('/')
                  assert parts[0] == 'frosted-background' and all(p not in ('', '.', '..') for p in parts), 'Unexpected archive path'
                  assert '\\' not in item.filename and '\x00' not in item.filename, 'Invalid path characters'
                  mode = stat.S_IFMT(item.external_attr >> 16)
                  assert mode in (0, stat.S_IFREG, stat.S_IFDIR), 'Links and special files are forbidden'
                  if len(parts) == 1 or item.is_dir(): continue
                  relative = pathlib.Path(*parts[1:])
                  assert '.git' not in relative.parts, 'Git internals are forbidden'
                  if '.github' in relative.parts: continue
                  name = relative.as_posix()
                  assert name.casefold() not in names, 'Duplicate archive member'
                  names.add(name.casefold())
                  target = root / relative
                  assert target.resolve().is_relative_to(root), 'Path escapes repository'
                  assert not any(p.is_symlink() for p in [target, *target.parents] if p.is_relative_to(root)), 'Existing symlink is forbidden'
                  data = source.read(item)
                  if target.exists():
                      assert target.is_file(), 'Target is not a regular file'
                      assert name in ('package.json', 'src/config.js') or target.read_bytes() == data, 'Conflicting existing file: ' + name
                  pending.append((target, data, name))
          assert pending, 'No source files to import'
          for target, data, name in pending:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          subprocess.run(['git', 'add', '--', *[name for _, _, name in pending]], check=True)
          PY
      - name: Commit source without touching workflows
        run: |
          git rm -- frosted-background-0.3.0-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import verified Frosted Background source'
          git push origin HEAD:main
