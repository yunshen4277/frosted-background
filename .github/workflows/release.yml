name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build, and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Bind update source to this repository
        shell: bash
        run: node scripts/bind-repository.js "$GITHUB_REPOSITORY"
      - name: Resolve and validate the stable release tag
        id: release
        shell: bash
        run: |
          release_tag="$(node scripts/release-manifest.js --resolve-ci-tag)"
          node scripts/release-manifest.js --validate-only --tag "$release_tag"
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
      - name: Install development dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Run all unit and browser tests
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node --test --test-concurrency=1 test/*.test.js
      - name: Build and checksum release files
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          node scripts/package.js --out "$RUNNER_TEMP/releases"
          node scripts/verify-package.js "$RUNNER_TEMP/releases/$(node -p "require('./package.json').name + '-' + require('./package.json').version").vsix"
          node scripts/release-manifest.js --out "$RUNNER_TEMP/releases" --tag "$RELEASE_TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release %s already exists; no assets were changed.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          tag_options=(--target "$GITHUB_SHA")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_options+=(--verify-tag)
          else
            existing_tags="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq 'length')"
            if [ "$existing_tags" != 0 ]; then
              printf 'Tag %s already exists; run this workflow on that tag instead of main.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/releases/"*.vsix \
            "$RUNNER_TEMP/releases/update-manifest.json" \
            "$RUNNER_TEMP/releases/"*-source.zip \
            "${tag_options[@]}" \
            --title "Frosted Background $RELEASE_TAG" \
            --generate-notes \
            --latest
